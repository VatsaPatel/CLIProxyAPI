# GitHub Copilot catalog snapshot validated on 2026-10-02.
# Responses models use codex-api-key, legacy/Gemini chat and embeddings use
# openai-compatibility, and Claude models use Anthropic Messages.
# Fable 5.1 remains on OpenRouter because GitHub does not expose it.
codex-api-key:
  - api-key: "YOUR_GITHUB_TOKEN"
    priority: 200
    base-url: "https://api.githubcopilot.com"
    headers:
      Copilot-Integration-Id: "copilot-developer-cli"
    stateful-responses: false
    models:
      - name: "gpt-5-mini"
        alias: "gpt-5-mini"
        display-name: "GPT-5 mini"
        force-mapping: true
        max-context-length: 128000
