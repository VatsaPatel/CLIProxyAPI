# GitHub Copilot exposes GPT-6 through Responses and Claude through Anthropic Messages.
# The same GitHub token can back both executor types. Keep Fable 5.1 on OpenRouter.
codex-api-key:
  - api-key: "YOUR_GITHUB_TOKEN"
    priority: 200
    base-url: "https://api.githubcopilot.com"
    headers:
      Copilot-Integration-Id: "copilot-developer-cli"
    stateful-responses: false
    models:
      - name: "gpt-6-astra"
        alias: "gpt-6-astra"
        display-name: "GPT 6 Astra"
        force-mapping: true
        max-context-length: 1050000
        max-completion-tokens: 128000
        input-modalities: [text, image]
        output-modalities: [text]
        thinking:
          levels: [low, medium, high, xhigh, max]
      - name: "gpt-6-sol"
        alias: "gpt-6-sol"
        display-name: "GPT 6 Sol"
        force-mapping: true
        max-context-length: 872000
        max-completion-tokens: 128000
        input-modalities: [text, image]
        output-modalities: [text]
        thinking:
          zero-allowed: true
          levels: [low, medium, high, xhigh, max]
      - name: "gpt-6-luna"
        alias: "gpt-6-luna"
        display-name: "GPT 6 Luna"
        force-mapping: true
        max-context-length: 872000
        max-completion-tokens: 128000
        input-modalities: [text, image]
        output-modalities: [text]
        thinking:
          zero-allowed: true
          levels: [low, medium, high, xhigh, max]

